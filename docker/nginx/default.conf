server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # só a pasta public do Laravel fica exposta
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    # Tudo que não for arquivo real vai para o index.php (o roteador do Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Arquivos .php são executados pelo PHP-FPM do container "app" na porta 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloqueia acesso a arquivos ocultos (.env, .git...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
