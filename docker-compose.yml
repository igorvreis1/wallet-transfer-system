# Orquestra os 4 serviços do projeto. Suba tudo com: docker compose up -d --build
# Os valores ${...} vêm do arquivo .env na raiz (copie de .env.example).

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.4
    container_name: wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wallet}
      MYSQL_USER: ${DB_USERNAME:-wallet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306" # 3307 no Windows, para não conflitar com um MySQL local
    volumes:
      - mysql_data:/var/lib/mysql # os dados sobrevivem quando o container é recriado
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro # cria o banco de testes na primeira subida
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backend: PHP-FPM executando o Laravel
  app:
    build:
      context: ./docker/php
    container_name: wallet-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql # o nome do serviço funciona como endereço dentro da rede do Docker
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wallet}
      DB_USERNAME: ${DB_USERNAME:-wallet}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./backend:/var/www/html # o código do Windows aparece dentro do container
    depends_on:
      mysql:
        condition: service_healthy # só sobe quando o MySQL já aceita conexões

  # Servidor web: recebe HTTP e repassa o PHP para o serviço "app"
  nginx:
    image: nginx:1.27-alpine
    container_name: wallet-nginx
    restart: unless-stopped
    ports:
      - "8000:80" # http://localhost:8000
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Frontend: servidor de desenvolvimento do Vite (React + TypeScript)
  frontend:
    image: node:22-alpine
    container_name: wallet-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173" # http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules # node_modules fica só no container (mais rápido no Windows)

volumes:
  mysql_data:
